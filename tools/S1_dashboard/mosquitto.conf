# mosquitto.conf
# Broker for subsystem 1 tests and the dashboard (Mosquitto 2.x).
# Used by start.bat. PRIVATE hotspot only: anyone on the network may connect.

# The car (MQTT over TCP)
listener 1883 0.0.0.0

# The dashboard in the browser (MQTT over WebSockets)
listener 9001
protocol websockets

allow_anonymous true